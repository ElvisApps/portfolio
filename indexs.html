<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Elvis Raganya — Web Developer & IT Specialist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Bricolage+Grotesque:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04050f;
  --bg2:#080a1a;
  --bg3:#0d1028;
  --surface:rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --a1:#FF6B35;
  --a2:#FF9F1C;
  --a3:#C77DFF;
  --a4:#48CAE4;
  --text:#F2F0FF;
  --muted:#8B89A8;
  --faint:#2a2a44;
  --font-h:'Clash Display',sans-serif;
  --font-b:'Bricolage Grotesque',sans-serif;
  --r:14px;
  --r2:22px;
}

html{scroll-behavior:smooth}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-b);
  font-size:16px;
  line-height:1.7;
  overflow-x:hidden;
}

img,
picture,
video,
canvas,
svg{
  max-width:100%;
  display:block;
}

/* BACKGROUND */
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-mesh::before{content:'';position:absolute;width:900px;height:900px;top:-300px;right:-300px;background:radial-gradient(circle,rgba(255,107,53,0.12) 0%,transparent 65%);animation:driftA 18s ease-in-out infinite alternate}
.bg-mesh::after{content:'';position:absolute;width:700px;height:700px;bottom:-200px;left:-200px;background:radial-gradient(circle,rgba(199,125,255,0.1) 0%,transparent 65%);animation:driftB 22s ease-in-out infinite alternate}
.bg-blob{position:absolute;width:500px;height:500px;top:40%;left:35%;background:radial-gradient(circle,rgba(72,202,228,0.07) 0%,transparent 65%);animation:driftC 15s ease-in-out infinite alternate}

@keyframes driftA{from{transform:translate(0,0) scale(1)}to{transform:translate(-80px,60px) scale(1.15)}}
@keyframes driftB{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,-80px) scale(1.1)}}
@keyframes driftC{from{transform:translate(0,0)}to{transform:translate(-40px,50px)}}

.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%)}

nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1rem 5%;
  backdrop-filter:blur(24px);
  background:rgba(4,5,15,0.75);
  border-bottom:1px solid var(--border)
}

.nav-logo{font-family:var(--font-h);font-size:1.15rem;font-weight:700;text-decoration:none;color:var(--text)}
.nav-logo em{font-style:normal;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-links{display:flex;gap:1.75rem;list-style:none}
.nav-links a{text-decoration:none;color:var(--muted);font-size:0.875rem;transition:color .2s}
.nav-links a:hover{color:var(--text)}
.nav-cta{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;padding:.5rem 1.25rem;border-radius:999px;font-size:.875rem;font-weight:600;text-decoration:none;font-family:var(--font-h)}

.wrapper{max-width:1100px;margin:0 auto;padding:0 5%;position:relative;z-index:2}

.hero{min-height:100vh;display:flex;align-items:center;padding-top:5rem}
.hero-inner{display:grid;grid-template-columns:1fr 340px;gap:3rem;align-items:center}
.hero h1{font-family:var(--font-h);font-size:clamp(2.8rem,5.5vw,5rem);font-weight:700;line-height:1.04;margin-bottom:1.5rem}
.hero h1 .g{background:linear-gradient(135deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{color:var(--muted);font-size:1.05rem;max-width:500px;margin-bottom:2.5rem;line-height:1.8}
.hero-btns{display:flex;gap:.9rem;flex-wrap:wrap}

.btn-p,.btn-s,.btn-resume{
  padding:.8rem 1.5rem;
  border-radius:999px;
  text-decoration:none;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.5rem;
}

.btn-p{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.btn-s{border:1px solid var(--border2);color:var(--text)}
.btn-resume{background:linear-gradient(135deg,var(--a3),var(--a4));color:#fff;border:none}

.hero-card{background:linear-gradient(145deg,rgba(255,107,53,.08),rgba(199,125,255,.06));border:1px solid var(--border);border-radius:var(--r2);padding:2rem}
.avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;color:#fff;margin-bottom:1.25rem}

section{padding:6rem 0;position:relative;z-index:2}
.s-title{font-family:var(--font-h);font-size:clamp(1.9rem,3.5vw,2.8rem);margin-bottom:1rem}
.s-desc{color:var(--muted)}

.about-grid,.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:3.5rem;margin-top:3rem}
.about-text p{color:var(--muted);margin-bottom:1rem}
.skills-wrap{display:flex;flex-wrap:wrap;gap:.5rem}
.sk,.c-item{background:rgba(255,255,255,.04);border:1px solid var(--border);padding:.35rem .85rem;border-radius:8px;font-size:.8rem;color:var(--muted)}

.resume-card{background:linear-gradient(135deg,rgba(199,125,255,.08),rgba(72,202,228,.06));border:1px solid rgba(199,125,255,.2);border-radius:var(--r2);padding:1.75rem;display:flex;align-items:center;gap:1.25rem;margin-top:1.5rem}

.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}
.proj-card,.cluster{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.proj-body,.cluster{padding:1.4rem}
.proj-thumb{height:180px;display:flex;align-items:center;justify-content:center}
.proj-thumb-text{font-size:4.5rem;color:rgba(255,255,255,.08)}
.proj-foot{display:flex;gap:.75rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}

.clusters{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.1rem;margin-top:2rem}

.c-form{display:flex;flex-direction:column;gap:1rem}
.c-form input,.c-form textarea{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);padding:.9rem 1rem;border-radius:var(--r);width:100%;font-size:16px}

footer{border-top:1px solid var(--border);padding:2rem 5%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}

.type-wrap{display:inline-block;border-right:3px solid var(--a1);padding-right:3px;white-space:nowrap;overflow:hidden}

/* TABLET */
@media (max-width: 992px) {
  .hero-inner,
  .about-grid,
  .contact-grid {
    grid-template-columns: 1fr;
    gap: 2rem;
  }

  .hero-card {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }

  .hero {
    min-height: auto;
    padding: 7rem 0 4rem;
  }

  .hero-sub {
    max-width: 100%;
  }
}

/* MOBILE */
@media (max-width: 768px) {
  body {
    font-size: 15px;
  }

  nav {
    padding: 1rem 1.2rem;
  }

  .nav-links {
    display: none;
  }

  .wrapper {
    padding: 0 1.2rem;
  }

  section {
    padding: 4rem 0;
  }

  .hero {
    padding-top: 6rem;
    text-align: center;
  }

  .hero-inner {
    grid-template-columns: 1fr;
    gap: 2.5rem;
  }

  .hero h1 {
    font-size: clamp(2.2rem, 9vw, 3.5rem);
    line-height: 1.1;
  }

  .hero-sub {
    font-size: 0.95rem;
    line-height: 1.7;
    margin-left: auto;
    margin-right: auto;
  }

  .hero-btns {
    justify-content: center;
    gap: 0.8rem;
  }

  .btn-p,
  .btn-s,
  .btn-resume {
    width: 100%;
  }

  .hero-card {
    width: 100%;
    padding: 1.5rem;
  }

  .avatar {
    margin: 0 auto 1rem;
  }

  .proj-grid,
  .clusters {
    grid-template-columns: 1fr;
  }

  .proj-thumb {
    height: 160px;
  }

  .proj-thumb-text {
    font-size: 3.5rem;
  }

  .resume-card {
    flex-direction: column;
    align-items: flex-start;
  }

  footer {
    flex-direction: column;
    text-align: center;
  }
}

/* SMALL PHONES */
@media (max-width: 480px) {
  .wrapper {
    padding: 0 1rem;
  }

  .hero h1 {
    font-size: 2rem;
  }

  .hero-sub {
    font-size: 0.9rem;
  }

  .proj-foot {
    flex-direction: column;
  }

  .type-wrap {
    white-space: normal;
    border-right: none;
  }
}
</style>
</head>
<body>

<div class="bg-mesh"><div class="bg-blob"></div></div>
<div class="bg-grid"></div>

<nav>
  <a href="#" class="nav-logo">Elvis<em>.</em></a>
  <ul class="nav-links">
    <li><a href="#about">About</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#experience">Experience</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <a href="#contact" class="nav-cta">Hire Me</a>
</nav>

<section class="hero">
  <div class="wrapper" style="width:100%">
    <div class="hero-inner">
      <div>
        <h1>
          <span class="type-wrap" id="typed-line"></span><br>
          <span class="g">& IT Specialist</span>
        </h1>
        <p class="hero-sub">Building responsive web applications and WordPress sites with clean code and great UX.</p>

        <div class="hero-btns">
          <a href="#projects" class="btn-p">View My Work</a>
          <a href="#contact" class="btn-s">Get in Touch</a>
          <a href="#" class="btn-resume">Download CV</a>
        </div>
      </div>

      <div class="hero-card">
        <div class="avatar">ER</div>
        <h3>Elvis Raganya</h3>
        <p style="color:var(--muted)">Frontend Developer · South Africa</p>
      </div>
    </div>
  </div>
</section>

<script>
const words = ['Web Developer','Frontend Dev','WordPress Expert','UI Builder'];
let wi=0,ci=0,del=false;
const el=document.getElementById('typed-line');

function type(){
  const w=words[wi];

  if(!del){
    el.textContent=w.slice(0,++ci);
    if(ci===w.length){
      del=true;
      setTimeout(type,1800);
      return;
    }
  }else{
    el.textContent=w.slice(0,--ci);
    if(ci===0){
      del=false;
      wi=(wi+1)%words.length;
      setTimeout(type,400);
      return;
    }
  }

  setTimeout(type,del?60:100);
}

type();

/* MOBILE PARALLAX SAFE */
if(window.innerWidth > 768){
  document.addEventListener('mousemove',e=>{
    const x=(e.clientX/window.innerWidth-.5)*20;
    const y=(e.clientY/window.innerHeight-.5)*20;
    document.querySelector('.bg-blob').style.transform=`translate(${x}px,${y}px)`;
  });
}
</script>

</body>
</html>
